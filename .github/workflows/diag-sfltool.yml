name: Diagnose sfltool (temporary)
on:
  push:
    paths: [".github/workflows/diag-sfltool.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Daemon and session
        run: |
          set +e
          sw_vers; id; who
          pgrep -lf backgroundtaskmanagement || echo "no daemon running"
          launchctl print system/com.apple.backgroundtaskmanagementd 2>&1 | head -25
          launchctl print gui/$(id -u) 2>&1 | head -5
          ls -ld /private/var/db/com.apple.backgroundtaskmanagement
      - name: sfltool with 90 s, stack sampled at 5 s
        run: |
          set +e
          start=$(date +%s)
          /usr/bin/sfltool dumpbtm < /dev/null > out.txt 2> err.txt &
          pid=$!
          sleep 5
          if kill -0 $pid 2>/dev/null; then
            echo "still running after 5 s; sampling"
            sample $pid 2 -mayDie 2>&1 | grep -E 'Thread|xpc|dispatch|mach_msg|semaphore|Authorization|SFL|BTM' | head -40
          fi
          for i in $(seq 1 85); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill -0 $pid 2>/dev/null && { echo "no answer after 90 s"; kill $pid; }
          wait $pid; echo "exit $? after $(( $(date +%s) - start )) s, $(wc -c < out.txt) bytes"
          head -c 400 out.txt; echo; cat err.txt
          log show --last 3m --style compact --predicate 'process == "backgroundtaskmanagementd" OR process == "sfltool"' 2>&1 | tail -30
      - name: sudo sfltool
        run: |
          set +e
          start=$(date +%s)
          sudo perl -e 'alarm 60; exec @ARGV' /usr/bin/sfltool dumpbtm < /dev/null > out2.txt 2>&1
          echo "sudo exit $? after $(( $(date +%s) - start )) s, $(wc -c < out2.txt) bytes"; head -c 300 out2.txt
