name: Release

# Runs when a version tag (v0.2.0, v1.0.0, ...) is pushed. Tags are made on main
# once a batch of work is merged, so every release is a tested state.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    # The release certificate is a secret of this environment, so the build waits for Lao's approval.
    environment: release
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      app_sha256: ${{ steps.installers.outputs.app_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches macx --version
        run: |
          set -euo pipefail
          WANT="${GITHUB_REF_NAME#v}"
          HAVE=$(grep -Eo 'macxVersion = "[^"]+"' Sources/MacxCore/Update.swift | cut -d'"' -f2)
          echo "tag $WANT, code $HAVE"
          [ "$WANT" = "$HAVE" ]
      - name: Test
        run: swift test
      - name: Build universal binary
        id: build
        run: |
          set -euo pipefail
          swift build -c release --arch arm64 --arch x86_64
          BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          lipo -archs "$BIN/macx"
          mkdir -p dist
          cp "$BIN/macx" dist/
          NAME="macx-${GITHUB_REF_NAME}-macos-universal.tar.gz"
          tar -C dist -czf "$NAME" macx
          shasum -a 256 "$NAME" > "$NAME.sha256"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"
          echo "sha256=$(shasum -a 256 "$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Sign the app and make the .pkg and .dmg
        id: installers
        env:
          P12: ${{ secrets.MACX_RELEASE_P12 }}
          P12_PASSWORD: ${{ secrets.MACX_RELEASE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::MACX_RELEASE_P12 isn't set in the release environment (scripts/release/make-release-cert.sh)."
            exit 1
          fi
          VER="${GITHUB_REF_NAME#v}"
          KC="$RUNNER_TEMP/release.keychain-db"
          KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf %s "$P12" | base64 -D > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          # The temporary keychain in the search list too, and the identity by its fingerprint, not its name.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -p codesigning "$KC" | awk '/"Macximesed Release Signing"/ { print $2; exit }')
          if [ -z "$ID" ]; then
            echo "::error::the release certificate isn't a signing identity in the keychain"
            security find-identity "$KC"; security find-certificate -a "$KC" | grep -E 'labl|alis' || true
            exit 1
          fi
          echo "Signing with $ID"
          scripts/make-app.sh dist/macx "$RUNNER_TEMP/Macximesed.app" "$VER" "$ID" "$KC"
          codesign -dvv "$RUNNER_TEMP/Macximesed.app" 2>&1 | grep -E '^(Identifier|Authority)='
          codesign -d -r- "$RUNNER_TEMP/Macximesed.app" 2>&1 | grep designated
          scripts/release/make-installers.sh "$RUNNER_TEMP/Macximesed.app" "$VER" installers
          # No AppleDouble files: the updater refuses an app archive with anything but the app in it.
          if pkgutil --payload-files "installers/Macximesed-$VER.pkg" | grep -q '/\._'; then
            echo "::error::the .pkg has ._ files in it"; exit 1
          fi
          if tar -tzf "installers/Macximesed-$VER-app.tar.gz" | grep -q '/\._\|^\._'; then
            echo "::error::the app archive has ._ files in it"; exit 1
          fi
          echo "app_sha256=$(cut -d' ' -f1 "installers/Macximesed-$VER-app.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
      - name: Forget the release certificate
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # The section for this version, up to the next "## [" heading.
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          cat >> notes.md <<'EOF'

          ---

          # Macximesed is free, so it isn't signed by Apple

          Apple charges developers $99 a year to sign and notarize apps. Macximesed doesn't pay that, so the first time you open it, macOS stops it with a message like *"Apple could not verify ... is free of malware"*. That's expected. Here's how to open it anyway.

          ### .pkg installer or .dmg
          1. Double-click the `.pkg`, or for the `.dmg`, drag Macximesed into Applications and double-click it there. macOS blocks it. Click **Done** (not *Move to Bin*).
          2. Open **System Settings > Privacy & Security** and scroll down to **Security**.
          3. Next to *"... was blocked to protect your Mac"*, click **Open Anyway**, then enter your password.
          4. Open the file again and click **Open**.

          Right-clicking and choosing *Open* no longer gets past this on current macOS. Use **Open Anyway**.

          ### .tar.gz (command line only)
          Check the `.sha256` file, then run this in Terminal:
          ```
          tar -xzf macx-*.tar.gz && xattr -d com.apple.quarantine macx && ./macx --help
          ```

          You only need to do this once per download.
          EOF
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/*.pkg installers/*.pkg.sha256 installers/*.dmg installers/*.dmg.sha256 \
            installers/*-app.tar.gz installers/*-app.tar.gz.sha256 "$ASSET" "$ASSET.sha256" \
            --title "Macximesed $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  channel:
    name: Update channel
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/channel.yml
    with:
      version: ${{ github.ref_name }}
      sha256: ${{ needs.release.outputs.sha256 }}
      app_sha256: ${{ needs.release.outputs.app_sha256 }}
    secrets: inherit
