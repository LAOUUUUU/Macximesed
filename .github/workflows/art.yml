name: Atomic Red Team

# Runs public Atomic Red Team tests against the live watch on throwaway GitHub macOS runners
# (research/independent-testing/PLAN.md). The tests really change the machine, which is why they only run here.
# No secrets and no write access: the job only reads the repo and uploads its logs.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays
  push:
    branches: [dev, claude/art-spike]
    paths:
      - "scripts/eval/art*"
      - ".github/workflows/art.yml"

permissions:
  contents: read

concurrency:
  group: art-${{ github.ref }}
  cancel-in-progress: true

env:
  ATOMICS_COMMIT: a0e3f9bc69fed2fd711bd1f1aa87a40c33482fe6
  IART_VERSION: 2.3.0

jobs:
  art:
    name: ART (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build macx
        run: swift build -c release
      - name: Install Invoke-AtomicRedTeam (pinned) and the atomics (pinned)
        run: |
          set -euo pipefail
          sudo pwsh -NoProfile -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted; Install-Module Invoke-AtomicRedTeam -RequiredVersion $IART_VERSION -Scope AllUsers -Force"
          curl -fsSL "https://github.com/redcanaryco/atomic-red-team/archive/$ATOMICS_COMMIT.tar.gz" -o atomics.tar.gz
          shasum -a 256 atomics.tar.gz
          mkdir -p "$RUNNER_TEMP/art" && tar -xzf atomics.tar.gz -C "$RUNNER_TEMP/art" --strip-components 1
          ls "$RUNNER_TEMP/art/atomics" | wc -l
      - name: Run the tests
        env:
          MACX_ART_THROWAWAY: "1"
          ART_CAPTURE: "T1027-1"
        run: ATOMICS="$RUNNER_TEMP/art/atomics" OUT=art-out MACX=.build/release/macx scripts/eval/art.sh
      - name: Report
        if: always()
        run: python3 -I scripts/eval/art-report.py art-out "${{ matrix.os }} ($(sw_vers -productVersion))" | tee art-out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: art-${{ matrix.os }}
          path: art-out
          retention-days: 30
